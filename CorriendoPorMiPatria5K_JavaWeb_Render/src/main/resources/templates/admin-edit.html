<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar participante</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="admin-edit-page"><div class="form-card admin-edit-card reveal"><div class="eyebrow">PANEL DE COORDINADORES</div><h2>EDITAR PARTICIPANTE</h2><div class="edit-bib" th:text="${participant.bibNumber}">PATRIA-0001</div>
<form th:action="@{'/admin/participantes/' + ${participant.id} + '/editar'}" th:object="${participant}" method="post" class="registration-form"><label>Nombre completo<input type="text" th:field="*{name}" required><small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></small></label><div class="form-row"><label>Edad<input type="number" th:field="*{age}" min="5" max="100" required></label><label>Municipio<input type="text" th:field="*{municipality}" required></label></div><label>Teléfono<input type="tel" th:field="*{phone}" required></label><div class="edit-actions"><a class="secondary-btn" href="/admin">CANCELAR</a><button class="primary-btn button-element" type="submit">GUARDAR CAMBIOS</button></div></form>
</div></div></body></html>

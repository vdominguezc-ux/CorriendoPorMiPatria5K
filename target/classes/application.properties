spring.application.name=CorriendoPorMiPatria5K
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=12h

# Local: H2 persistente. En Render/Neon define las variables SPRING_DATASOURCE_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/patria5k;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guatemala

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Contraseña coordinadores. En Render puede cambiarse con ADMIN_PASSWORD.
app.admin-password=${ADMIN_PASSWORD:2026}

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inscripción confirmada</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div class="confirmation-page">
  <div class="confirmation-card reveal">
    <img src="/images/nueva_frecuencia_logo.jpg" class="confirmation-logo" alt="Nueva Frecuencia">
    <div class="success-mark">✓</div>
    <div class="eyebrow">¡INSCRIPCIÓN REALIZADA CON ÉXITO!</div>
    <h1 th:text="${participant.name}">Participante</h1>
    <p>Tu número oficial de corredor es:</p>
    <div class="bib-number" th:text="${participant.bibNumber}">PATRIA-0001</div>
    <div class="confirmation-event"><b>Domingo 13 de septiembre de 2026</b><span>6:30 AM</span><span>Parqueo Plaza Américas</span></div>
    <div class="confirmation-actions"><button class="secondary-btn button-element" onclick="window.print()">IMPRIMIR / GUARDAR</button><a class="primary-btn" href="/">VOLVER AL INICIO</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
</body></html>
